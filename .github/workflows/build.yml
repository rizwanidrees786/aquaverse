name: AquaVerse Build APK & AAB

on:
  push:
    branches: [ main, develop, "release/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      artifact_type:
        description: "Choose artifact to build"
        required: true
        default: "release_apk"
        type: choice
        options:
          - debug_apk
          - release_apk
          - release_aab
          - all

env:
  FLUTTER_VERSION: "3.27.1"
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: Build Android (${{ inputs.artifact_type || 'release_apk' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies & run codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run analysis & tests
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'debug_apk' || inputs.artifact_type == 'all' }}
        run: flutter build apk --debug

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'release_apk' || inputs.artifact_type == 'all' }}
        run: flutter build apk --release

      - name: Build Release AAB
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'release_aab' || inputs.artifact_type == 'all' }}
        run: flutter build appbundle --release

      - name: Upload Debug APK
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'debug_apk' || inputs.artifact_type == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: aquaverse-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release APK
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'release_apk' || inputs.artifact_type == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: aquaverse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'release_aab' || inputs.artifact_type == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: aquaverse-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
